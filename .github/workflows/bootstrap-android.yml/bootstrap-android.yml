name: Bootstrap Android (Capacitor)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor dependencies
        run: |
          npm install
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/local-notifications@^7
          npm install -D @capacitor/assets@^3

      - name: Build web app
        run: npm run build

      - name: Add Android project and generate icons
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Show generated Android build file
        run: cat android/app/build.gradle

      - name: Patch Android project (release signing + notification permissions)
        run: |
          python3 - <<'PY'
          import pathlib, re

          # 1) android/app/build.gradle — توقيع الإصدار من keystore.properties (إن وُجد)
          bg = pathlib.Path('android/app/build.gradle')
          s = bg.read_text()
          anchor = '    buildTypes {'
          assert anchor in s, 'buildTypes block not found in build.gradle'
          signing = (
              '    def keystorePropertiesFile = rootProject.file("keystore.properties")\n'
              '    def keystoreProperties = new Properties()\n'
              '    if (keystorePropertiesFile.exists()) {\n'
              '        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
              '    }\n'
              '    signingConfigs {\n'
              '        release {\n'
              '            if (keystorePropertiesFile.exists()) {\n'
              "                keyAlias keystoreProperties['keyAlias']\n"
              "                keyPassword keystoreProperties['keyPassword']\n"
              "                storeFile file(keystoreProperties['storeFile'])\n"
              "                storePassword keystoreProperties['storePassword']\n"
              '            }\n'
              '        }\n'
              '    }\n'
          )
          s = s.replace(anchor, signing + anchor, 1)
          m = re.search(r'(release \{\n(\s+)minifyEnabled false\n)', s)
          assert m, 'release buildType block not found in build.gradle'
          s = s[:m.start()] + 'release {\n' + m.group(2) + 'if (keystorePropertiesFile.exists()) { signingConfig signingConfigs.release }\n' + m.group(2) + 'minifyEnabled false\n' + s[m.end():]
          bg.write_text(s)
          print('patched build.gradle')

          # 2) AndroidManifest — أذونات إشعارات أندرويد
          man = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          x = man.read_text()
          perms = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ]
          add = [p for p in perms if p.split('"')[1] not in x]
          if add:
              x = x.replace('<application', '\n'.join(add) + '\n    <application', 1)
              man.write_text(x)
          print('manifest permissions added:', len(add))
          PY

      - name: Verify Android assets
        run: |
          test -f android/app/src/main/assets/public/index.html
          ls android/app/src/main/res/mipmap-xxxhdpi/

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "أضف مشروع أندرويد عبر Capacitor (توليد آلي)"
          git push
