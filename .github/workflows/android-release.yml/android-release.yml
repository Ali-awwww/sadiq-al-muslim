name: Android Release APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'إنشاء إصدار GitHub وإرفاق APK به'
        type: boolean
        default: false
      tag:
        description: 'وسم الإصدار'
        default: 'v1.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify signature and certificate fingerprint
        id: verify
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          CERT_SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep 'SHA-256 digest' | head -n 1 | sed 's/.*SHA-256 digest: //')
          KS_SHA=$(keytool -list -v -keystore android/release.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep 'SHA256:' | awk '{print $2}')
          echo "APK certificate SHA-256: $CERT_SHA"
          echo "Keystore certificate SHA-256: $KS_SHA"
          test -n "$CERT_SHA" && test "$CERT_SHA" = "$KS_SHA"
          echo "sha256=$CERT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: ${{ inputs.create_release && steps.verify.outputs.sha256 != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          NOTES="تطبيق أندرويد «صديق المسلم» (مصحف متكامل) — الإصدار الأول.

          - APK إصدار (Release) موقّع بشهادة الإصدار الخاصة بالتطبيق.
          - مبني من فرع main عبر Capacitor دون تغيير ميزات الويب.
          - بصمة شهادة التوقيع (SHA-256): ${{ steps.verify.outputs.sha256 }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "$TAG — تطبيق أندرويد «صديق المسلم»" --notes "$NOTES"
          fi
