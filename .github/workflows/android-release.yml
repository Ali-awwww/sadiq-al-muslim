name: Android release (signed APK)

# يبني APK موقّعاً للإصدار من مشروع Android، ويتحقق أن توقيعه وبصمته
# SHA-256 يطابقان الـ Keystore الجديد، ثم ينشئ إصدار GitHub v1.4.7
# مرفقاً به الـ APK عند طلب ذلك.
#
# الأسرار المطلوبة في المستودع:
#   ANDROID_KEYSTORE_BASE64 : نسخة base64 من الـ Keystore (ملف release.keystore)
#   KEYSTORE_PASSWORD       : كلمة مرور مخزن المفاتيح
#   KEY_ALIAS               : upload
#   KEY_PASSWORD            : كلمة مرور المفتاح
# تُجهَّز هذه الأسرار مرة واحدة من أثر سير عمل generate-keystore.yml،
# ولا يُلتزم الـ Keystore ولا كلمات المرور في المستودع أبداً.
# ملاحظة: لا يمكن استخدام سياق secrets في شروط if في GitHub Actions،
# لذلك تتحقق خطوتا استعادة الـ Keystore والتحقق من التوقيع من وجود
# الأسرار داخل السكربت نفسه وتتخطيان العمل بهدوء عند غيابها.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'إنشاء إصدار GitHub v1.4.7 مرفقاً به الـ APK؟'
        required: true
        type: boolean
        default: true
      tag:
        description: 'وسم الإصدار'
        required: true
        type: string
        default: v1.4.7
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore misplaced files to their intended paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          pairs = {
              'assets/icon.svg/icon.svg': 'assets/icon.svg',
              'assets/splash.svg/splash.svg': 'assets/splash.svg',
              'public/icon.svg/icon.svg': 'public/icon.svg',
          }
          for src, dst in pairs.items():
              s = Path(src)
              if s.is_file():
                  d = Path(dst)
                  tmp = Path(dst + '.tmp-restore')
                  shutil.move(str(s), str(tmp))
                  try:
                      s.parent.rmdir()
                  except OSError:
                      pass
                  shutil.move(str(tmp), str(d))
                  print(f'restored {src} -> {dst}')
          PY
          ls -l capacitor.config.json src/lib/nativeReminders.ts assets/icon.svg assets/splash.svg public/icon.svg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          ls "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Install dependencies
        run: |
          npm ci || npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8 @capacitor/local-notifications@^8

      - name: Build web app
        run: npm run build

      - name: Check Android project exists
        run: |
          test -d android || { echo "Android project not found. Run the bootstrap workflow first."; exit 1; }
          test -f android/app/build.gradle

      - name: Verify custom URL scheme in AndroidManifest
        run: |
          grep -n 'android:scheme="sadiqalmuslim"' android/app/src/main/AndroidManifest.xml
          grep -n 'android.intent.action.VIEW' android/app/src/main/AndroidManifest.xml
          grep -n 'android.intent.category.BROWSABLE' android/app/src/main/AndroidManifest.xml

      - name: Restore keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "ANDROID_KEYSTORE_BASE64 secret is empty; skipping keystore restore."; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          keyAlias=upload
          keyPassword=$KEY_PASSWORD
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          EOF
          ls -l android/release.keystore android/keystore.properties

      - name: Sync web build into Android
        run: npx cap sync android

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature and SHA-256 fingerprint
        id: verify
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "Keystore secret is empty; skipping signature verification."; exit 0; fi
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          CERT_SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep 'SHA-256 digest' | sed 's/.*SHA-256 digest: //')
          echo "APK certificate SHA-256: $CERT_SHA"
          KS_SHA=$(keytool -list -v -keystore android/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias upload | grep 'SHA256:' | awk '{print $2}')
          echo "Keystore SHA-256: $KS_SHA"
          if [ -z "$CERT_SHA" ] || [ -z "$KS_SHA" ]; then
            echo "Could not read SHA-256 fingerprint from APK or keystore"; exit 1
          fi
          CERT_NORM=$(echo "$CERT_SHA" | tr 'a-f' 'A-F' | tr -d ':')
          KS_NORM=$(echo "$KS_SHA" | tr 'a-f' 'A-F' | tr -d ':')
          if [ "$CERT_NORM" != "$KS_NORM" ]; then
            echo "SHA-256 mismatch: APK $CERT_SHA != keystore $KS_SHA"; exit 1
          fi
          CERT_FMT=$(echo "$CERT_NORM" | sed 's/\(..\)/\1:/g; s/:$//')
          echo "SHA-256 fingerprint matches the keystore: $CERT_FMT"
          echo "sha256=$CERT_FMT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadiq-al-muslim-v1.4.7-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub release v1.4.7
        if: ${{ inputs.create_release && steps.verify.outputs.sha256 != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "صديق المسلم v1.4.7"
          body: |
            الإصدار 1.4.7 من تطبيق «صديق المسلم» (versionCode 12) — الوضع النصي الجديد: قراءة بنص عثماني متصل يملأ الشاشة بلا إطار، مع الضغط على الآية لتمييزها بإطار، ومؤشر أسفل الشاشة برقم صفحة المصحف والحزب، وضبط حجم النص من قائمة خيارات الصفحة (⋯)، والاستماع يعمل في الوضع النصي مع تمييز أصفر للآية الحالية وتمرير تلقائي لها. الحفاظ الكامل على كل مميزات v1.4.6.

            - مصحف متكامل على الويب: قراءة بالرسم العثماني، تلاوة القراء، تفسير، حفظ، وتتبع الختمة.
            - تمييز أصفر شفاف للآية الحالية مباشرة على صفحة المصحف يواكب الصوت وانتقال الصفحات.
            - قائمة خيارات شبكية مدمجة ومنظمة لشاشات الهواتف.
            - تذكيرات محلية بإشعارات أندرويد.
            - مخطط الرابط المخصص: sadiqalmuslim (يفتح التطبيق من زر «افتح التطبيق» في المعرض).
            - بصمة SHA-256 للشهادة: ${{ steps.verify.outputs.sha256 }}
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
