name: Generate release keystore

# سير عمل لمرة واحدة: يولّد Keystore إصدار جديد خاص بهذا التطبيق فقط
# (alias: upload) ويرفعه كأثر (artifact) لنقله إلى أسرار المستودع.
# يُحذف هذا الملف بعد إعداد الأسرار. لا يُطبع الـ Keystore ولا كلمات
# المرور في السجلات أبداً.

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'كلمة مرور مخزن المفاتيح (Keystore password)'
        required: true
        type: string
      key_password:
        description: 'كلمة مرور المفتاح (Key password)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          STORE_PASS: ${{ inputs.store_password }}
          KEY_PASS: ${{ inputs.key_password }}
        run: |
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          rm -f release.keystore
          keytool -genkeypair -keystore release.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Sadiq Al-Muslim, OU=Mobile, O=Sadiq Al-Muslim, L=Damascus, C=SY"
          keytool -list -v -keystore release.keystore -alias upload -storepass "$STORE_PASS" | tee fingerprint.txt
          base64 -w0 release.keystore > keystore-base64.txt
          split -n 4 -d keystore-base64.txt keystore-base64-part-
          wc -c keystore-base64.txt keystore-base64-part-*

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-base64
          path: |
            keystore-base64.txt
            keystore-base64-part-*
            fingerprint.txt
          if-no-files-found: error
